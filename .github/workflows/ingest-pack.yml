name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ImageMagick 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: Rail Post
        run: |
          set -euo pipefail
          D=rail-post
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/post.zip" "$B/post.zip"
          curl -fsSL -o /tmp/pv "$B/screenshot_20261108_215957.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Rail Post

          - 출처 URL: https://opengameart.org/content/rail-post
          - 받은 파일: post.zip (14.8 KB)
          - 라이선스: CC0
          - 제작자: Q2DENJINDREW
          - 공개일: 2026-11-08
          - 파일 수: 1
          - 태그: rail, post, fence, wood, dungeon, 3d, lowpoly
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Rail Post

          출처 URL: https://opengameart.org/content/rail-post
          표기 라이선스: CC0
          제작자: Q2DENJINDREW
          공개일: 2026-11-08

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Rail Post 추가"
          git push
      - name: Humanoid SoulsLike Animations
        run: |
          set -euo pipefail
          D=humanoid-soulslike-animations
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/playerfistweaponanimations.blend" "$B/playerfistweaponanimations.blend"
          curl -fsSL -o "$D/playerstraightswordanimations.blend" "$B/playerstraightswordanimations.blend"
          curl -fsSL -o "$D/fistweaponanimationpack.zip" "$B/fistweaponanimationpack.zip"
          curl -fsSL -o /tmp/pv "$B/0003_1.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Humanoid SoulsLike Animations

          - 출처 URL: https://opengameart.org/content/humanoid-soulslike-animations
          - 받은 파일: playerfistweaponanimations.blend (1.7 MB), playerstraightswordanimations.blend (2.4 MB), fistweaponanimationpack.zip (3.2 MB)
          - 라이선스: CC0
          - 제작자: Gres
          - 공개일: 2026-10-04
          - 파일 수: 3
          - 태그: soulslike, character, animation, blend, fist, sword, 3d, lowpoly
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Humanoid SoulsLike Animations

          출처 URL: https://opengameart.org/content/humanoid-soulslike-animations
          표기 라이선스: CC0
          제작자: Gres
          공개일: 2026-10-04

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Humanoid SoulsLike Animations 추가"
          git push
      - name: B-chan
        run: |
          set -euo pipefail
          D=b-chan
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/bchan_edited.blend" "$B/bchan_edited.blend"
          curl -fsSL -o "$D/rig_tools_3.73.26.zip" "$B/rig_tools_3.73.26.zip"
          curl -fsSL -o /tmp/pv "$B/bchan_salute_0.jpg"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # B-chan

          - 출처 URL: https://opengameart.org/content/b-chan
          - 받은 파일: bchan_edited.blend (23.6 MB), rig_tools_3.73.26.zip (58 KB)
          - 라이선스: CC0
          - 제작자: hardboileduser (원작 AmarilloArts)
          - 공개일: 2026-10-02
          - 파일 수: 2
          - 태그: character, female, rigged, chibi, blend, 3d
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          B-chan

          출처 URL: https://opengameart.org/content/b-chan
          표기 라이선스: CC0
          제작자: hardboileduser (원작 AmarilloArts)
          공개일: 2026-10-02

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: B-chan 추가"
          git push
