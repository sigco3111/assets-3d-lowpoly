name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick unzip zip >/dev/null
      - name: ingest
        run: |
          set -x
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          run_one() {
            SLUG="$1"; TITLE="$2"; URL="$3"; LIC="$4"; AUTHOR="$5"; PUB="$6"; TAGS="$7"; SRC="$8"; CREDIT="$9"
            echo "== $SLUG"
            mkdir -p "$SLUG"
            rm -rf _x && mkdir _x
            curl -fsSL --retry 3 -o _dl "$URL" || { echo "DOWNLOAD FAIL $SLUG"; return 1; }
            if unzip -tq _dl >/dev/null 2>&1; then
              cp _dl "$SLUG/$SLUG.zip"
              unzip -qo "$SLUG/$SLUG.zip" -d _x || true
            else
              cp _dl "_x/$(basename "$URL")"
              (cd _x && zip -q -r "../$SLUG/$SLUG.zip" .)
            fi
            N=$(find _x -type f | wc -l)
            PREV=$(find _x -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            if [ -n "$PREV" ]; then
              convert "$PREV[0]" -resize 512x512 -background white -gravity center -extent 512x512 "$SLUG/preview.jpg"
            else
              convert -size 512x512 xc:white -pointsize 24 -gravity center -annotate +0+0 "$TITLE" "$SLUG/preview.jpg"
            fi
            rm -rf _x
            ZSIZE=$(du -h "$SLUG/$SLUG.zip" | cut -f1)
            cat > "$SLUG/pack.md" <<EOF
          # $TITLE
          - 출처 URL: $SRC
          - 받은 파일: $SLUG.zip ($ZSIZE)
          - 라이선스: $LIC
          - 제작자: $AUTHOR
          - 공개일: $PUB
          - 파일 수: $N
          - 태그: $TAGS
          - 표기 요구: $CREDIT
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
            cat > "$SLUG/LICENSE-SOURCE.txt" <<EOF
          $TITLE
          출처 URL: $SRC
          표기 라이선스: $LIC
          제작자: $AUTHOR
          공개일: $PUB
          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          EOF
            case "$CREDIT" in
              yes*) cat > "$SLUG/CREDITS.txt" <<EOF
          $TITLE
          제작자: $AUTHOR (OpenGameArt.org)
          출처: $SRC
          라이선스: $LIC
          표기 예:
          "$TITLE" by $AUTHOR (OpenGameArt.org), $LIC
          EOF
              ;;
            esac
            git add -A
            git commit -m "에셋: $TITLE 추가"
            git push
          }
          run_one low-poly-camping-assets "Low Poly Camping Assets" "https://opengameart.org/sites/default/files/low_poly_camping_assets.zip" "CC0" "Saraskau" "2025-05-03" "camping,tent,prop,lowpoly,3d" "https://opengameart.org/content/low-poly-camping-assets" no
          run_one low-poly-retro-psx-skeleton "Low-poly Retro PSX Skeleton" "https://opengameart.org/sites/default/files/skeleton33.blend" "CC-BY 4.0" "LonesomeDucky" "2025-03-02" "skeleton,character,psx,retro,3d" "https://opengameart.org/content/low-poly-retro-psx-skeleton" yes
          git log --oneline -3
