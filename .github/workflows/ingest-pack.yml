name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick unzip zip
      - run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          one() {
            S=$1; T=$2; U=$3; L=$4; A=$5; P=$6; G=$7; R=$8; C=$9
            mkdir -p $S; rm -rf _x; mkdir _x
            curl -fsSL --retry 3 -o _dl "$U" || { echo FAIL $S; return 1; }
            if unzip -tq _dl >/dev/null 2>&1; then cp _dl $S/$S.zip; unzip -qo $S/$S.zip -d _x; else cp _dl _x/$(basename $U); (cd _x && zip -q -r ../$S/$S.zip .); fi
            N=$(find _x -type f | wc -l)
            I=$(find _x -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            if [ -n "$I" ]; then convert "$I[0]" -resize 512x512 -background white -gravity center -extent 512x512 $S/p.jpg; else convert -size 512x512 xc:white -annotate +0+0 "$T" $S/p.jpg; fi
            convert $S/p.jpg $S/preview.jpg; rm -f $S/p.jpg; rm -rf _x
            Z=$(du -h $S/$S.zip | cut -f1)
            printf '# %s\n- 출처 URL: %s\n- 받은 파일: %s.zip (%s)\n- 라이선스: %s\n- 제작자: %s\n- 공개일: %s\n- 파일 수: %s\n- 태그: %s\n- 표기 요구: %s\n- AI 생성 여부: 출처 페이지에 언급 없음\n' "$T" "$R" $S "$Z" "$L" "$A" "$P" "$N" "$G" "$C" > $S/pack.md
            printf '%s\n출처 URL: %s\n표기 라이선스: %s\n제작자: %s\n공개일: %s\n이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.\n' "$T" "$R" "$L" "$A" "$P" > $S/LICENSE-SOURCE.txt
            case "$C" in yes*) printf '%s\n제작자: %s (OpenGameArt.org)\n출처: %s\n라이선스: %s\n표기 예:\n"%s" by %s (OpenGameArt.org), %s\n' "$T" "$A" "$R" "$L" "$T" "$A" "$L" > $S/CREDITS.txt;; esac
            git add -A; git commit -qm "에셋: $T 추가"; git push
          }
          one low-poly-camping-assets "Low Poly Camping Assets" "https://opengameart.org/sites/default/files/low_poly_camping_assets.zip" "CC0" Saraskau 2025-05-03 "camping,tent,prop,lowpoly,3d" "https://opengameart.org/content/low-poly-camping-assets" no
          one low-poly-retro-psx-skeleton "Low-poly Retro PSX Skeleton" "https://opengameart.org/sites/default/files/skeleton33.blend" "CC-BY 4.0" LonesomeDucky 2025-03-02 "skeleton,character,psx,retro,3d" "https://opengameart.org/content/low-poly-retro-psx-skeleton" yes
