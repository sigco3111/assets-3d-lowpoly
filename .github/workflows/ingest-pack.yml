name: ingest-pack
on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pack slug or all"
        required: true
        default: "all"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest packs
        env:
          PACK: ${{ inputs.pack }}
        run: |
          python3 - <<'PY'
          import os, subprocess, urllib.request

          PACKS = [
            {
              "slug": "asian-girl",
              "name": "Asian Girl",
              "source": "https://opengameart.org/content/asian-girl",
              "license": "CC-BY 4.0",
              "author": "McPato (hardboileduser)",
              "date": "2026-10-14",
              "tags": "character, rigged, ps2, human, girl, 3d, lowpoly",
              "attribution": "Asian Girl by McPato licensed CC-BY 4.0: https://mcpato.itch.io/asian-girl-ps2-style-character",
              "ai": "출처 페이지에 언급 없음",
              "files": ["https://opengameart.org/sites/default/files/dorposefbx.zip"],
              "preview": "https://opengameart.org/sites/default/files/psx_girl.jpg",
              "preview_name": "preview.jpg",
            },
            {
              "slug": "space-port-kit",
              "name": "Space port kit",
              "source": "https://opengameart.org/content/space-port-kit",
              "license": "CC-BY 4.0",
              "author": "Ludrol",
              "date": "2026-07-29",
              "tags": "space, spaceport, rocket, terminal, tower, 3d, lowpoly",
              "attribution": "Made by Ludrol CC-BY-4.0",
              "ai": "출처 페이지에 언급 없음",
              "files": [
                "https://opengameart.org/sites/default/files/space_port_kit_glb.zip",
                "https://opengameart.org/sites/default/files/space_port_kit_blend.zip",
              ],
              "preview": "https://opengameart.org/sites/default/files/thumbnail_47.png",
              "preview_name": "preview.png",
            },
          ]

          def dl(url, path):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as r, open(path, "wb") as f:
                  f.write(r.read())

          sel = os.environ.get("PACK", "all")
          for p in PACKS:
              if sel != "all" and sel != p["slug"]:
                  continue
              d = p["slug"]
              os.makedirs(d, exist_ok=True)
              got = []
              for u in p["files"]:
                  fn = u.split("/")[-1]
                  dl(u, os.path.join(d, fn))
                  got.append((fn, os.path.getsize(os.path.join(d, fn))))
              dl(p["preview"], os.path.join(d, p["preview_name"]))
              size_txt = ", ".join("%s (%.1f KB)" % (n, s / 1024.0) for n, s in got)
              with open(os.path.join(d, "pack.md"), "w", encoding="utf-8") as f:
                  f.write("# %s\n\n" % p["name"])
                  f.write("- 출처 URL: %s\n" % p["source"])
                  f.write("- 받은 파일: %s\n" % size_txt)
                  f.write("- 라이선스: %s\n" % p["license"])
                  f.write("- 제작자: %s\n" % p["author"])
                  f.write("- 공개일: %s\n" % p["date"])
                  f.write("- 파일 수: %d\n" % len(got))
                  f.write("- 태그: %s\n" % p["tags"])
                  f.write("- 표기 요구: 있음 (CC-BY 4.0, CREDITS.txt 참조)\n")
                  f.write("- AI 생성 여부: %s\n" % p["ai"])
              with open(os.path.join(d, "LICENSE-SOURCE.txt"), "w", encoding="utf-8") as f:
                  f.write("%s\n\n" % p["name"])
                  f.write("출처 URL: %s\n" % p["source"])
                  f.write("표기 라이선스: %s\n" % p["license"])
                  f.write("제작자: %s\n" % p["author"])
                  f.write("공개일: %s\n\n" % p["date"])
                  f.write("이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.\n")
                  f.write("원본 배포물(zip)에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.\n")
              with open(os.path.join(d, "CREDITS.txt"), "w", encoding="utf-8") as f:
                  f.write("%s\n\n" % p["name"])
                  f.write("%s\n" % p["attribution"])
                  f.write("원본: %s\n" % p["source"])
                  f.write("라이선스: %s (https://creativecommons.org/licenses/by/4.0/)\n" % p["license"])
              subprocess.run(["git", "add", d], check=True)
              subprocess.run(["git", "-c", "user.name=sigco3111", "-c", "user.email=sigco3111@users.noreply.github.com",
                              "commit", "-m", "에셋: %s 추가" % p["name"]], check=True)
              subprocess.run(["git", "push"], check=True)
              print("done", d)
          PY
