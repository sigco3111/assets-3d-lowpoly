name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ImageMagick 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Mini Rocket
        run: |
          set -euo pipefail
          D=mini-rocket
          mkdir -p "$D"
          curl -fsSL -o "$D/mini_rocket.zip" "https://opengameart.org/sites/default/files/mini_rocket.zip"
          curl -fsSL -o /tmp/mr.png "https://opengameart.org/sites/default/files/preview_1389.png"
          convert /tmp/mr.png -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Mini Rocket

          - 출처 URL: https://opengameart.org/content/mini-rocket
          - 받은 파일: mini_rocket.zip (1.7 MB)
          - 라이선스: CC0
          - 제작자: David W CG
          - 공개일: 2026-06-09
          - 파일 수: 1 (zip 안에 blend·glb·PBR 텍스처)
          - 태그: scifi, rocket, missile, weapon, 3d, lowpoly
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Mini Rocket

          출처 URL: https://opengameart.org/content/mini-rocket
          표기 라이선스: CC0
          제작자: David W CG
          공개일: 2026-06-09

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물(zip)에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Mini Rocket 추가"
          git push
      - name: 3D Sara - Wizard
        run: |
          set -euo pipefail
          D=3d-sara-wizard
          mkdir -p "$D"
          curl -fsSL -o "$D/sara.blend" "https://opengameart.org/sites/default/files/sara.blend"
          curl -fsSL -o "$D/sara_fbx.zip" "https://opengameart.org/sites/default/files/sara_fbx.zip"
          curl -fsSL -o "$D/sara_glb.zip" "https://opengameart.org/sites/default/files/sara_glb.zip"
          curl -fsSL -o /tmp/sara.jpg "https://opengameart.org/sites/default/files/sara_p1_0.jpg"
          convert /tmp/sara.jpg -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # 3D Sara - Wizard

          - 출처 URL: https://opengameart.org/content/3d-sara-wizard
          - 받은 파일: sara.blend (2.6 MB), sara_fbx.zip (3.2 MB), sara_glb.zip (1.6 MB)
          - 라이선스: CC-BY 3.0
          - 제작자: Mish7913 (원화 Mandi Paugh)
          - 공개일: 2026-08-09
          - 파일 수: 3
          - 태그: sara, mascot, wizard, character, rigged, animated, 3d, lowpoly
          - 표기 요구: 있음 ("3D model created by Mish7913, based on Mandi Paugh image.", CREDITS.txt 참조)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          3D Sara - Wizard

          출처 URL: https://opengameart.org/content/3d-sara-wizard
          표기 라이선스: CC-BY 3.0
          제작자: Mish7913 (원화 Mandi Paugh)
          공개일: 2026-08-09

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          cat > "$D/CREDITS.txt" <<'EOF'
          3D Sara - Wizard

          3D model created by Mish7913, based on Mandi Paugh image. Licensed CC-BY 3.0.
          원본: https://opengameart.org/content/3d-sara-wizard
          라이선스: CC-BY 3.0 (https://creativecommons.org/licenses/by/3.0/)
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: 3D Sara - Wizard 추가"
          git push
