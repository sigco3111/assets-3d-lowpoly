name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ImageMagick 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: Lock
        run: |
          set -euo pipefail
          D=lock
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/lock.zip" "https://opengameart.org/sites/default/files/lock.zip"
          curl -fsSL -o /tmp/pv "https://opengameart.org/sites/default/files/lock_5.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Lock

          - 출처 URL: https://opengameart.org/content/lock-1
          - 받은 파일: lock.zip (1 KB)
          - 라이선스: CC0
          - 제작자: Q2DENJINDREW
          - 공개일: 2026-10-02
          - 파일 수: 1
          - 태그: lock, low poly, retro, blockbench, 3d
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Lock
          
          출처 URL: https://opengameart.org/content/lock-1
          표기 라이선스: CC0
          제작자: Q2DENJINDREW
          공개일: 2026-10-02
          
          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Lock 추가"
          git push
      - name: Stylized Coin
        run: |
          set -euo pipefail
          D=stylized-coin
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/coin.blend" "https://opengameart.org/sites/default/files/coin_1.blend"
          curl -fsSL -o /tmp/pv "https://opengameart.org/sites/default/files/screenshot_20260916_132159.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Stylized Coin

          - 출처 URL: https://opengameart.org/content/stylized-coin
          - 받은 파일: coin.blend (134.4 KB)
          - 라이선스: CC0
          - 제작자: optimuspryne
          - 공개일: 2026-09-16
          - 파일 수: 1
          - 태그: coin, gold, stylized, prop, blend, 3d
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Stylized Coin
          
          출처 URL: https://opengameart.org/content/stylized-coin
          표기 라이선스: CC0
          제작자: optimuspryne
          공개일: 2026-09-16
          
          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Stylized Coin 추가"
          git push
      - name: Dice
        run: |
          set -euo pipefail
          D=dice
          B=https://opengameart.org/sites/default/files
          mkdir -p "$D"
          curl -fsSL -o "$D/dice.zip" "https://opengameart.org/sites/default/files/dice_10.zip"
          curl -fsSL -o /tmp/pv "https://opengameart.org/sites/default/files/dice_render_0.png"
          convert /tmp/pv -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Dice

          - 출처 URL: https://opengameart.org/content/dice-6
          - 받은 파일: dice.zip (148.2 KB)
          - 라이선스: CC0
          - 제작자: gearfox98
          - 공개일: 2026-09-10
          - 파일 수: 1
          - 태그: dice, board game, prop, blender, 3d
          - 표기 요구: 없음 (CC0)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Dice
          
          출처 URL: https://opengameart.org/content/dice-6
          표기 라이선스: CC0
          제작자: gearfox98
          공개일: 2026-09-10
          
          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Dice 추가"
          git push
