name: ingest-a85
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick unzip zip
      - run: bash .github/scripts/one.sh tool-pack-1 "https://opengameart.org/sites/default/files/tool_pack_1.zip" "Tool Pack 1" CC0 LonesomeDucky 2025-03-07 "tool,prop,lowpoly,3d" "https://opengameart.org/content/tool-pack-1" no
      - run: bash .github/scripts/one.sh toolbox "https://opengameart.org/sites/default/files/toolbox60.blend" "Toolbox" CC0 LonesomeDucky 2025-03-04 "tool,prop,lowpoly,3d" "https://opengameart.org/content/toolbox-0" no
concurrency: 
