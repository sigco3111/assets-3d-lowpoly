name: A86 3D 수집
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick zip
      - name: 팩 준비
        run: |
          python3 - <<'PY'
          import os,shutil,subprocess,urllib.request,zipfile
          packs=[
           dict(slug='tool-pack-1',name='Tool Pack 1',zip='tool_pack_1.zip',page='https://opengameart.org/content/tool-pack-1',url='https://opengameart.org/sites/default/files/tool_pack_1.zip',img='https://opengameart.org/sites/default/files/tools1_preview.png',author='LonesomeDucky',date='2025-03-07',size='17.8MB',tags='tool,prop,3d'),
           dict(slug='toolbox',name='Toolbox',zip='toolbox60.blend',page='https://opengameart.org/content/toolbox-0',url='https://opengameart.org/sites/default/files/toolbox60.blend',img='https://opengameart.org/sites/default/files/toolbox_preview.png',author='LonesomeDucky',date='2025-03-04',size='13MB',tags='tool,prop,3d'),
           dict(slug='3d-cobblestone-texture',name='3D Cobblestone Texture',zip='cobblestone.zip',page='https://opengameart.org/content/3d-cobblestone-texture',url='https://opengameart.org/sites/default/files/cobblestone.zip',img='https://opengameart.org/sites/default/files/img_1860_small.png',author='ZaninDevelopers',date='2026-11-07',size='34.7MB',tags='texture,cobblestone,3d'),
          ]
          for p in packs:
              d=p['slug']
              os.makedirs(d,exist_ok=True)
              z='/tmp/'+p['zip']
              urllib.request.urlretrieve(p['url'],z)
              zf=p['zip']
              if zf.endswith('.blend'):
                  zf=d+'.zip'
                  subprocess.run(['zip','-q','-j',os.path.join(d,zf),z],check=True)
              else:
                  shutil.copy(z,os.path.join(d,zf))
              try:
                  urllib.request.urlretrieve(p['img'],'/tmp/pv')
                  subprocess.run(['convert','/tmp/pv','-resize','1200x1200>','-quality','85',os.path.join(d,'preview.jpg')],check=True)
              except Exception as e:
                  print('preview skip',d,e)
              n=len(zipfile.ZipFile(os.path.join(d,zf)).namelist())
              m='# '+p['name']+chr(10)+chr(10)+'- 출처 URL: '+p['page']+chr(10)+'- 받은 파일: '+zf+' ('+p['size']+')'+chr(10)+'- 라이선스: CC0'+chr(10)+'- 제작자: '+p['author']+chr(10)+'- 공개일: '+p['date']+chr(10)+'- 파일 수: '+str(n)+chr(10)+'- 태그: '+p['tags']+chr(10)+'- 표기 요구: 없음 (CC0)'+chr(10)+'- AI 생성 여부: 출처 페이지에 언급 없음'+chr(10)
              open(os.path.join(d,'pack.md'),'w').write(m)
              l=p['name']+chr(10)+chr(10)+'출처 URL: '+p['page']+chr(10)+'표기 라이선스: CC0'+chr(10)+'제작자: '+p['author']+chr(10)+'공개일: '+p['date']+chr(10)+chr(10)+'이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.'+chr(10)+'원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.'+chr(10)
              open(os.path.join(d,'LICENSE-SOURCE.txt'),'w').write(l)
              print(d,n)
          PY
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          for t in "tool-pack-1:Tool Pack 1" "toolbox:Toolbox" "3d-cobblestone-texture:3D Cobblestone Texture"; do
            s="${t%%:*}"
            m="${t#*:}"
            git add "$s"
            git commit -m "에셋: $m 추가"
            git push
            echo "done $s"
          done
