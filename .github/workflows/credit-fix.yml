name: credit-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add
        run: |
          cat > ghost-lady-model-untextured/CREDITS.txt <<'EOF'
          Ghost lady model (UNTEXTURED)
          
          제작자: Kabrolkin (OpenGameArt.org)
          출처: https://opengameart.org/content/ghost-lady-model-untextured
          라이선스: CC-BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
          
          표기 예:
          "Ghost lady model (UNTEXTURED)" by Kabrolkin (OpenGameArt.org), CC-BY 4.0
          EOF
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add -A
          git commit -m "에셋: Ghost lady model (UNTEXTURED) 크레딧 추가"
          git push
