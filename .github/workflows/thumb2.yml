name: 썸네일 보완 (임시)
on: push
permissions:
  contents: write
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, subprocess, json, base64
          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          API = "https://api.github.com"
          folder, name, target = "elemental-golem", "Elemental Golem", "previews/elemental-golem.png"
          def run(a):
              return subprocess.run(a, capture_output=True, text=True)
          src = None
          for f in os.listdir(folder):
              if f.lower().startswith("preview") and f.lower().endswith((".jpg", ".png", ".jpeg")):
                  src = os.path.join(folder, f)
          if src is None:
              raise SystemExit("no preview image")
          run(["convert", src + "[0]", "-resize", "480x480>", "-strip", "png24:/tmp/out.png"])
          if os.path.getsize("/tmp/out.png") > 200000:
              run(["convert", "/tmp/out.png", "-strip", "-quality", "85", "/tmp/out.jpg"])
              path, target = "/tmp/out.jpg", target[:-4] + ".jpg"
          else:
              path = "/tmp/out.png"
          payload = json.dumps({"message": "썸네일: " + name + " 추가", "branch": "main",
                                "content": base64.b64encode(open(path, "rb").read()).decode()})
          r = subprocess.run(["curl", "-sS", "-X", "PUT", "-H", "Authorization: Bearer " + TOKEN,
                              "-H", "Accept: application/vnd.github+json", "-H", "Content-Type: application/json",
                              "--data-binary", "@-", API + "/repos/" + REPO + "/contents/" + target],
                             input=payload, capture_output=True, text=True)
          print(target, r.stdout[:200])
          PY
