name: ingest-once
on:
  workflow_dispatch:
    inputs:
      folder:
        required: true
      zip_url:
        required: true
      zip_name:
        required: true
      preview_url:
        required: false
        default: ""
      title:
        required: true
      files_b64:
        required: true
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest
        env:
          FOLDER: ${{ inputs.folder }}
          ZIP_URL: ${{ inputs.zip_url }}
          ZIP_NAME: ${{ inputs.zip_name }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          TITLE: ${{ inputs.title }}
          FILES_B64: ${{ inputs.files_b64 }}
        run: |
          set -euo pipefail
          mkdir -p "$FOLDER"
          curl -fsSL "$ZIP_URL" -o "$FOLDER/$ZIP_NAME"
          if [ -n "${PREVIEW_URL:-}" ]; then curl -fsSL "$PREVIEW_URL" -o "$FOLDER/preview.${PREVIEW_URL##*.}"; fi
          python3 <<'PY'
          import base64, json, os, zipfile
          folder = os.environ["FOLDER"]
          zpath = os.path.join(folder, os.environ["ZIP_NAME"])
          n = len([i for i in zipfile.ZipFile(zpath).infolist() if not i.is_dir()])
          meta = json.loads(base64.b64decode(os.environ["FILES_B64"]).decode("utf-8"))
          for name, body in meta.items():
              with open(os.path.join(folder, name), "w", encoding="utf-8") as f:
                  f.write(body.replace("{{FILES}}", str(n)))
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add "$FOLDER"
          git commit -m "에셋: $TITLE 추가"
          git push
